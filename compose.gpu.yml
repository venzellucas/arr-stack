# Hardware transcoding for Jellyfin. Switch it on in .env:
#   COMPOSE_FILE=docker-compose.yml:compose.gpu.yml
#   RENDER_GID=<group of /dev/dri/renderD128, see: stat -c %g /dev/dri/renderD128>
services:
  jellyfin:
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:?set RENDER_GID in .env to the group of /dev/dri/renderD128}"
