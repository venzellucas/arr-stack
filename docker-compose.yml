# HolyArrs, qBittorrent and Jellyfin on one Docker host.
# Every setting has a default, so no .env file is needed. To override a value,
# copy .env.example to .env (Compose reads it automatically) or export it.

name: media

networks:
  media:
    name: media

# Docker's json-file logs have no size limit by default. A container stuck in
# a crash loop could otherwise fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  logging: *logging
  security_opt: [no-new-privileges:true]
  networks: [media]
  restart: unless-stopped

services:
  holyarrs:
    <<: *app
    image: holyarrs/holyarrs:latest
    container_name: holyarrs
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      # Behind a reverse proxy: the host name browsers use, and the proxy's
      # address, so sign-in can tell local clients from outside ones.
      - HOLYARRS_ALLOWED_HOSTS=${HOLYARRS_HOST:-}
      - HOLYARRS_TRUSTED_PROXIES=${REVERSE_PROXY:-}
      # Optional held-back features, comma separated, e.g. subtitle_sites.
      - HOLYARRS_FLAGS=${HOLYARRS_FLAGS:-}
    volumes:
      - ${CONFIG_DIR:-/opt/appdata}/holyarrs:/config
      - ${DATA_DIR:-/data}:/data
    ports: ["6262:6262"]

  qbittorrent:
    <<: *app
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - WEBUI_PORT=8080
      - TORRENTING_PORT=${TORRENTING_PORT:-6881}
    volumes:
      - ${CONFIG_DIR:-/opt/appdata}/qbittorrent:/config
      # Same /data as HolyArrs, so finished downloads become hardlinks.
      - ${DATA_DIR:-/data}:/data
    ports:
      - "8080:8080"
      - "${TORRENTING_PORT:-6881}:${TORRENTING_PORT:-6881}"
      - "${TORRENTING_PORT:-6881}:${TORRENTING_PORT:-6881}/udp"
    healthcheck:
      # Any HTTP answer, even "unauthorized", means the Web UI is up.
      test: ["CMD-SHELL", "curl -so /dev/null http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  jellyfin:
    <<: *app
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_DIR:-/opt/appdata}/jellyfin:/config
      - ${DATA_DIR:-/data}/media:/data/media:ro
    ports: ["8096:8096"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8096/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  updater:
    # Pulls new images for the three apps on a schedule and restarts the ones
    # that changed. It never updates itself; `make up` does that. HolyArrs
    # backs up its own data before an update that changes it.
    <<: *app
    image: docker:cli
    container_name: media-updater
    environment:
      - TZ=${TZ:-Etc/UTC}
      - UPDATE_SCHEDULE=${UPDATE_SCHEDULE:-0 5 * * 0}
      # Set by make, so updates keep the same files (e.g. the GPU override).
      - COMPOSE_FILE=${COMPOSE_FILE:-docker-compose.yml}
      - RENDER_GID=${RENDER_GID:-}
    working_dir: /stack
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/stack:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        echo "$$UPDATE_SCHEDULE /bin/sh /stack/scripts/update.sh >/proc/1/fd/1 2>&1" | crontab - &&
        exec crond -f -l 6
